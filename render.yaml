services:
  - type: web
    runtime: node
    name: detailerz
    buildCommand: cd app && npm ci --include=dev && npm --prefix web ci --include=dev && npm run build
    startCommand: cd app && npm start
    healthCheckPath: /health
    envVars:
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_TO
        sync: false
